[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seisgeomech"
version = "3.0.0"
description = "Testing Gardner's density relation at well 48/10b-9 and following its error into overburden stress and seismic reflectivity"
readme = "README.md"
requires-python = ">=3.10"   # verified on 3.10.12 and 3.11.15
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "lasio>=0.31",
    "bruges>=0.5.4",
    "setuptools<81",   # bruges 0.5.4 imports pkg_resources; see requirements.txt
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
