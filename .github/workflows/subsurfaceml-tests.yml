# Runs the SubsurfaceML test suite (advanced-subsurface-modelling/SubsurfaceML)
# with the pinned environment recorded in requirements-lock.txt.
name: SubsurfaceML tests

on:
  push:
    paths:
      - "advanced-subsurface-modelling/SubsurfaceML/**"
      - ".github/workflows/subsurfaceml-tests.yml"
  pull_request:
    paths:
      - "advanced-subsurface-modelling/SubsurfaceML/**"
      - ".github/workflows/subsurfaceml-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advanced-subsurface-modelling/SubsurfaceML
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: advanced-subsurface-modelling/SubsurfaceML/requirements-lock.txt
      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Tests
        run: python -m pytest
      - name: Saved models load and predict
        run: subsurfaceml predict --config config/study.yaml --input examples/worked_example_input.json
