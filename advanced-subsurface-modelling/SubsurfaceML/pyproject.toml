[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subsurfaceml"
version = "3.0.0"
description = "Layered radial CO2-brine IMPES simulator, analytical ROM and hybrid surrogates with reservoir-calibrated intervals and verification-gated schedule screening (synthetic data)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.4",
  "matplotlib>=3.8", "joblib>=1.3", "PyYAML>=6.0",
]

[project.optional-dependencies]
full = ["xgboost>=2.0", "shap>=0.44", "imbalanced-learn>=0.12",
        "scikit-optimize>=0.10", "umap-learn>=0.5", "streamlit>=1.30"]
dev  = ["pytest>=7.4"]

[project.scripts]
subsurfaceml = "subsurfaceml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
