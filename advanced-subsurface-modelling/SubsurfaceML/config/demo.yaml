# SubsurfaceML - fast demonstration configuration.
#
# The complete pipeline (verification -> dataset -> ML -> screening -> report)
# on a normal CPU; measured runtime is in results/demo/metrics/summary.json.
# Numbers here are deliberately small; `study.yaml` is the publication-scale run.
name: demo

paths:
  # `root` defaults to the project directory; every other path may be relative
  # to it or absolute. On Windows use forward slashes or double backslashes.
  results: results/demo
  figures: results/demo/figures
  data: results/demo/data
  models: results/demo/models
  metrics: results/demo/metrics
  reports: results/demo/reports
  # OPTIONAL - the supplied course material (Models/ and "Data Science and
  # machine learning/") is NOT part of this repository. To let the supporting
  # notebook s1 check that the cited source files exist, set the environment
  # variable SUBSURFACEML_COURSE_DIR to your own copy, or uncomment:
  # course_materials: "/path/to/course/folder"

grid:
  n_r: 40             # radial cells per layer
  n_layers: 4         # stratified, no vertical crossflow
  r_w_m: 0.15
  r_e_m: 5000.0       # overridden per realisation by scenarios.r_e_m
  r_near_m: 10.0      # well-block outer radius (see grid.RadialGrid docstring)
  h_total_m: 40.0

solver:
  max_dS: 0.05        # max saturation change per step (accept/reject control)
  cfl: 0.9           # fraction of the local CFL limit (enforced)
  dt_init_s: 3600.0
  dt_max_days: 180.0
  dt_min_s: 1.0
  max_overshoot: 0.001  # two-sided discrete maximum-principle tolerance
  enforce_cfl: true   # strict CFL; the relaxed controller let odd-even
                      # oscillations of up to ~0.03 in S_g develop near the well
  outer_bc: closed        # sealed compartment: pressure accumulates, so schedule SHAPE matters
  p_init_MPa: 15.0

schedule:
  n_periods: 4
  t_inject_years: 5.0
  t_total_years: 10.0   # 5 yr injection + 5 yr shut-in monitoring
  dp_ref_MPa: 5.0        # reference buildup used to size the per-realisation q_ref
  q_mult_min: 0.15       # schedules are log-uniform multiples of q_ref
  q_mult_max: 4.0        # wide enough that a stated LIMIT binds, not the sampling box
  q_min_kg_s: 0.01       # numerical floor only; a 1 kg/s floor clipped >50% of schedules
  q_max_kg_s: 250.0
  n_report: 41

scenarios:
  n_realisations: 100
  n_schedules_per_realisation: 3
  seed: 20260909
  # ---- assumed prior ranges for a generic deep saline aquifer ----
  k_median_mD: [30.0, 1000.0]     # log-uniform
  V_DP: [0.05, 0.85]
  phi_mean: [0.10, 0.28]
  h_total_m: [20.0, 80.0]
  r_e_m: [1200.0, 4000.0]         # sealed compartment radius
  n_g: [1.5, 3.0]
  n_a: [2.0, 4.0]
  krg0: [0.20, 0.65]
  S_ar: [0.15, 0.35]
  mu_g_cP: [0.04, 0.08]
  rho_g: [600.0, 780.0]

ml:
  test_fraction: 0.25
  calib_fraction: 0.25
  n_splits: 4
  n_iter_search: 12
  random_state: 0
  # Retained mass is deliberately NOT an ML target: under the sealed-compartment
  # base case CO2 mass balance makes it identical to the planned injected mass,
  # which is a closed-form function of the decision variables. Training a model
  # to reproduce a conservation identity measures nothing. The optimiser
  # therefore computes the objective exactly and uses the surrogates only for
  # the two CONSTRAINT quantities plus an emergent efficiency measure.
  targets: [dp_bh_max_MPa, r_plume_m95_m, sweep_efficiency]
  band_lower_pct: 5.0    # empirical error band = P5..P95 of calibration residuals
  band_upper_pct: 95.0
  margin_warning_fraction: 0.8   # traffic light: amber above 80% of the allowed buildup
  run_studies: true      # the ML-method studies (studies.py)

optim:
  # BOTH limits are stated scenario assumptions, not demonstrated safety limits.
  p_limit_MPa: 24.0
  r_plume_limit_m: 400.0
  n_candidates: 3000
  n_shortlist: 6
  n_test_realisations: 5
  use_error_band: true

n_jobs: -1
