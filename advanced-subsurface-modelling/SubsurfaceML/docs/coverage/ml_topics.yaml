# FROZEN inventory of the substantive topics taught in the supplied
# "Data Science and machine learning" folder (identical to its .zip).
#
# Frozen on 2026-09-20 BEFORE any coverage method was chosen. Do not edit the
# topic list to change the percentage; scripts/build_coverage.py refuses to
# run if the hash of this list changes without the `frozen_hash` being updated
# deliberately.
#
# Granularity rule: one topic = one method or concept that the course teaches
# as a unit (a lecture section / exercise notebook heading). Variants taught
# together in the same section (e.g. Ridge/Lasso/ElasticNet, t-SNE/UMAP,
# grid/random search) are ONE topic. Duplicate notebooks are never counted
# twice. Setup/administration material is excluded (listed under `excluded`).
#
# Coverage = substantively implemented topics / total topics below (42).

topics:
  # ---------------- 1. Data preprocessing ----------------
  P01: {name: "Data cleaning: duplicate removal, dropping uninformative columns",
        sources: [Lecture01.ipynb, "E01_EDA (1).ipynb", "E01_Preprocessing (1).ipynb", "E01_FeatureEngineering_Encoding (1).ipynb", "E01_Pipeline (1).ipynb", OptionalE03.ipynb, E03_geographicalspliting.ipynb]}
  P02: {name: "Hold-out split and leakage-free fit/transform (fit on train only)",
        sources: [Lecture01.ipynb, Extra_transformer.ipynb, "E01_Preprocessing (1).ipynb", "E01_EDA (1).ipynb"]}
  P03: {name: "Exploratory data analysis: summary statistics, histograms, scatter, correlation heat map",
        sources: [Lecture02.ipynb, "E01_EDA (1).ipynb", LiveCode1.ipynb, LiveCode2.ipynb]}
  P04: {name: "Missing data and imputation (SimpleImputer)",
        sources: [Lecture01.ipynb, "E01_Preprocessing (1).ipynb", Extra_transformer.ipynb, OptionalE03.ipynb]}
  P05: {name: "Outlier detection and handling (z-score, IQR)",
        sources: [Lecture02.ipynb, "E01_EDA (1).ipynb", "E01_Preprocessing (1).ipynb", "E01_FeatureEngineering_Encoding (1).ipynb"]}
  P06: {name: "Feature scaling (Standard, MinMax, Robust scalers)",
        sources: [Lecture01.ipynb, "E01_Preprocessing (1).ipynb", "E01_Pipeline (1).ipynb", OptionalE03.ipynb]}
  P07: {name: "Categorical encoding (one-hot, label/ordinal, target encoding)",
        sources: [Lecture03.ipynb, "E01_FeatureEngineering_Encoding (1).ipynb", "E01_Pipeline (1).ipynb", E03_geographicalspliting.ipynb]}
  P08: {name: "Feature engineering: log transforms, binning, derived/domain features, polynomial and interaction terms",
        sources: [Lecture02.ipynb, Lecture03.ipynb, Lecture08.ipynb, "E01_FeatureEngineering_Encoding (1).ipynb", OptionalE03.ipynb]}
  P09: {name: "Pipelines, ColumnTransformer, FunctionTransformer",
        sources: [Lecture04.ipynb, "E01_Pipeline (1).ipynb", E03_geographicalspliting.ipynb, LiveCode1.ipynb, LiveCode2.ipynb]}
  P10: {name: "Collinearity analysis and correlation-threshold feature removal",
        sources: [Lecture05.ipynb, "E01_FeatureSelection (1).ipynb", E03_geographicalspliting.ipynb, Lecture07.ipynb, 01-Swarm-Behaviour_VL.ipynb]}
  P11: {name: "Permutation feature importance",
        sources: [Lecture05.ipynb, "E01_FeatureSelection (1).ipynb", 01-Swarm-Behaviour_VL.ipynb]}
  P12: {name: "Feature-selection families: filter, wrapper, embedded",
        sources: [Lecture05.ipynb]}
  P13: {name: "Imbalanced data: under/over-sampling, SMOTE, class weights",
        sources: [Lecture06.ipynb, E04_Imbalance.ipynb, 01-Swarm-Behaviour_VL.ipynb]}
  P14: {name: "Geographical and temporal (grouped) train/test splitting",
        sources: [Lecture08.ipynb, E03_geographicalspliting.ipynb]}
  # ---------------- 2. Machine-learning algorithms ----------------
  A01: {name: "Linear regression: cost function, normal equation, gradient descent",
        sources: [Lecture01.ipynb, mathematics_regression.ipynb, "E02_ModelingAndEvaluation (1).ipynb"]}
  A02: {name: "Regularised regression: Ridge, Lasso, ElasticNet",
        sources: [Lecture02.ipynb, "E02_Regularization (1).ipynb", mathematics_regression.ipynb, "E03-LearningCurve (1).ipynb"]}
  A03: {name: "Logistic regression (binary classification)",
        sources: [Lecture03.ipynb, "E02_logisticRegression (1).ipynb", math_classifications.ipynb, 01-Swarm-Behaviour_VL.ipynb]}
  A04: {name: "Multiclass classification (OvR, OvO, multinomial) and multiclass confusion matrix",
        sources: ["E02_Multiclassification (1).ipynb", multiclassification.ipynb, Lecture03.ipynb]}
  A05: {name: "K-nearest neighbours",
        sources: [Lecture04.ipynb, "E03_ROC_AUC (1).ipynb", "E02_Multiclassification (1).ipynb", math_classifications.ipynb]}
  A06: {name: "Support vector machines (SVC/SVR, kernels, C)",
        sources: [Lecture05.ipynb, "E01_HyperparameterSVM (1).ipynb", math_classifications.ipynb]}
  A07: {name: "Decision trees",
        sources: [Lecture05.ipynb, math_classifications.ipynb, "E02_Ensembles (1).ipynb"]}
  A08: {name: "Bagging and random forests (incl. impurity feature importance)",
        sources: [Lecture06.ipynb, "E02_Ensembles (1).ipynb", "E03_TuningRandomforest (1).ipynb"]}
  A09: {name: "Boosting: AdaBoost, gradient boosting, XGBoost (with early stopping)",
        sources: [Lecture06.ipynb, "E02_Ensembles (1).ipynb"]}
  A10: {name: "Voting and stacking ensembles",
        sources: [Lecture06.ipynb, "E02_Ensembles (1).ipynb"]}
  A11: {name: "Principal component analysis (explained variance, scree, choosing k, PCA as preprocessing)",
        sources: [Lecture07.ipynb, "E01_PCA (1).ipynb", PCA.ipynb, multiclassification.ipynb]}
  A12: {name: "Kernel PCA",
        sources: [Lecture07.ipynb]}
  A13: {name: "K-means clustering",
        sources: [Lecture07.ipynb, E02_clustering.ipynb]}
  A14: {name: "DBSCAN",
        sources: [Lecture07.ipynb]}
  A15: {name: "t-SNE and UMAP manifold projections",
        sources: [Lecture08.ipynb, "E01_UMAP_tSNE (1).ipynb", utils.py]}
  # ---------------- 3. Model selection and evaluation ----------------
  E01: {name: "Regression metrics: MAE, MSE, RMSE, R2, max error",
        sources: [Lecture01.ipynb, "E03_Evaluationmetrics (1).ipynb", "E02_ModelingAndEvaluation (1).ipynb", results.csv]}
  E02: {name: "Baseline models (mean / dummy predictor) as the reference score",
        sources: [Lecture01.ipynb, "E01_FeatureSelection (1).ipynb", 02-core_RPlatt.ipynb, 03-Asteroid-Impact_RPlatt.ipynb]}
  E03: {name: "Bias-variance, over/under-fitting and learning curves",
        sources: [Lecture02.ipynb, "E03-LearningCurve (1).ipynb", LiveCode1.ipynb, LiveCode2.ipynb, "E02_Ensembles (1).ipynb"]}
  E04: {name: "Classification metrics: confusion matrix, accuracy, precision, recall, F1",
        sources: [Lecture03.ipynb, "E02_logisticRegression (1).ipynb", "E02-Threshold (1).ipynb"]}
  E05: {name: "Precision-recall trade-off and decision-threshold adjustment",
        sources: [Lecture04.ipynb, "E02-Threshold (1).ipynb", 01-Swarm-Behaviour_VL.ipynb]}
  E06: {name: "ROC curve and AUC",
        sources: [Lecture04.ipynb, "E03_ROC_AUC (1).ipynb", 03-Asteroid-Impact_RPlatt.ipynb]}
  E07: {name: "K-fold cross-validation",
        sources: [Lecture05.ipynb, LiveCode2.ipynb, "E01_FeatureSelection (1).ipynb", 02-core_RPlatt.ipynb]}
  E08: {name: "Hyper-parameter search: grid search and randomised search (incl. inside pipelines)",
        sources: [Lecture06.ipynb, "E03_TuningRandomforest (1).ipynb", "E01_HyperparameterSVM (1).ipynb", "E01_PCA (1).ipynb"]}
  E09: {name: "Bayesian optimisation of hyper-parameters (BayesSearchCV)",
        sources: [Lecture06.ipynb, "E03_TuningRandomforest (1).ipynb"]}
  E10: {name: "Clustering evaluation: inertia/elbow, silhouette, Davies-Bouldin, adjusted mutual information",
        sources: [Lecture07.ipynb]}
  E11: {name: "SHAP explanations",
        sources: [Lecture08.ipynb, E02_SHAP.ipynb]}
  E12: {name: "LIME local surrogate explanations",
        sources: [Lecture08.ipynb]}
  E13: {name: "Counterfactual / what-if analysis of model predictions",
        sources: [Lecture08.ipynb]}

excluded:
  - {what: "Environment setup, canonical imports, random_state conventions", files: [E0_Instruction.ipynb, "E0_Instruction (1).ipynb"], reason: "administrative setup, not a method"}
  - {what: "Module logistics, assessment description, acknowledgements", files: [Lecture01.ipynb], reason: "administrative sections of an otherwise mapped notebook"}
  - {what: "Saving results to CSV", files: ["E02_ModelingAndEvaluation (1).ipynb"], reason: "file I/O, not a method"}
  - {what: "Past assessments", files: [01-Swarm-Behaviour.ipynb, 01-Swarm-Behaviour_VL.ipynb, 02-core.ipynb, 02-core_RPlatt.ipynb, 03-Asteroid-Impact.ipynb, 03-Asteroid-Impact_RPlatt.ipynb], reason: "applications of topics already listed; they add no new topic (their contributions are cited as secondary sources above)"}
  - {what: "Optional open exercise with no content beyond a title", files: [E03_houseprice.ipynb, "E03_houseprice (1).ipynb"], reason: "no taught method"}

